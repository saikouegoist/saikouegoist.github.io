# Guard: editor.html is a LOCAL-ONLY content tool and must never be
# committed or deployed to GitHub Pages. Fail loudly if it ever is.
name: guard-editor

on:
  push:
    paths:
      - "editor.html"
  pull_request:
    paths:
      - "editor.html"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse editor.html
        run: |
          echo "::error::editor.html is a local-only tool and must not be committed. Remove it (git rm --cached editor.html), add it to .gitignore, and push again."
          exit 1
