<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - you are lost</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="assets/cat.jpg">
  <style>
    :root {
      --bg-page: #000000;
      --bg-card: #08080a;
      --bg-header: #162482;
      --text-header: #ffffff;
      --border-color: #38383f;
      --text-main: #d6d6dc;
      --text-muted: #9999a3;
      --link-color: #7b84ff;
      --font-mono: "Courier New", Courier, monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 40px;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
    }
    .wrap { max-width: 620px; margin: 40px auto 0; }
    .box { border: 1px solid var(--border-color); background: var(--bg-card); }
    .box-header {
      background: var(--bg-header);
      color: var(--text-header);
      padding: 4px 10px;
      font-family: var(--font-ui);
      font-size: 1.05rem;
      font-weight: 700;
    }
    .box-content { padding: 18px 16px; }
    .big-404 {
      font-family: var(--font-mono);
      font-size: 3.2rem;
      font-weight: 800;
      color: #f87171;
      text-shadow: 3px 3px 0 #000;
      margin: 0 0 4px 0;
      letter-spacing: 2px;
    }
    .mock-line {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      background: #030712;
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      margin: 12px 0;
      min-height: 44px;
    }
    .mock-line .cursor { animation: blink 1s steps(2) infinite; color: #4ade80; }
    @keyframes blink { 50% { opacity: 0; } }
    .home-btn {
      display: inline-block;
      background: var(--bg-header);
      color: #fff;
      border: 1px solid #4338ca;
      padding: 8px 18px;
      font-family: var(--font-ui);
      font-weight: 700;
      text-decoration: none;
      margin-top: 8px;
    }
    .home-btn:hover { background: #1f30a8; }
    .foot { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 16px; font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="box-header">404: page not found</div>
      <div class="box-content">
        <p class="big-404">4 0 4</p>
        <div class="mock-line">&gt; <span id="mock-text">loading insult...</span><span class="cursor">_</span></div>
        <p style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);">requested: <span id="bad-url">unknown</span></p>
        <a class="home-btn" id="home-link" href="./">&larr; retreat to homepage</a>
      </div>
    </div>
    <p class="foot">best viewed without expectations — and with working URLs</p>
  </div>
  <script>
    var mocks = [
      "wow. lost on a site with 8 pages. impressive.",
      "this page doesn't exist. neither does your sense of direction.",
      "congrats, you found nothing. achievement unlocked.",
      "the page saw you coming and left.",
      "you typed with confidence and still got it wrong.",
      "even the cat found this page before you. and it's a cat.",
      "404: curiosity detected, competence not found.",
      "this URL is as real as your productivity today.",
      "the hamster powering this site suggests you go back.",
      "you've reached the void. it judges you."
    ];
    document.getElementById('mock-text').textContent =
      mocks[Math.floor(Math.random() * mocks.length)];
    try {
      document.getElementById('bad-url').textContent = location.pathname;
    } catch (e) {}
    // GitHub Pages serves 404.html at the missing path, so ./ can point
    // back into the missing folder. Resolve to the repo root instead:
    // /<repo>/ for project pages, / for user/apex sites.
    // First path segment is only a repo name if it is NOT one of this
    // site's own top-level routes/asset folders (user-site nested paths
    // like /articles/foo must resolve home to /, not /articles/).
    try {
      var knownRoots = ['articles', 'notes', 'projects', 'about', 'links', 'guestbook', 'temples', 'unknown', 'assets', 'images', 'data', 'scripts'];
      var parts = location.pathname.split('/').filter(Boolean);
      var home = '/';
      // A single top-level FILE (editor.html, style.css, ...) is not a repo
      // name — previously /editor.html resolved home to /editor.html/.
      if (parts.length >= 1 && knownRoots.indexOf(parts[0].toLowerCase()) === -1 &&
          !(parts.length === 1 && parts[0].indexOf('.') !== -1)) {
        home = '/' + parts[0] + '/';
      }
      var link = document.getElementById('home-link');
      if (link) link.setAttribute('href', home);
      var icon = document.querySelector('link[rel="icon"]');
      if (icon) icon.setAttribute('href', home + 'assets/cat.jpg');
    } catch (e) {}
  </script>
</body>
</html>
